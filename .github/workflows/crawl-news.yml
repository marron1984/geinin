name: ニュース自動クロール

on:
  schedule:
    # 6時間ごと（UTC 0/6/12/18時 = JST 9/15/21/3時）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ニュースをクロール
        run: node scripts/crawl-news.mjs

      - name: 変更があればコミット＆プッシュ
        run: |
          if git diff --quiet src/data/news.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          git commit -m "chore: ニュース自動更新 [skip ci]"
          git push
